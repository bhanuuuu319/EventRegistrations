<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"><title>Log in · EventRegister</title></head>
<body>
<div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>
<main class="auth-wrap">
  <section class="glass auth-card narrow">
    <a class="brand d-inline-block mb-3" href="index.html"><i class="bi bi-stars"></i> EventRegister</a>
    <h1 class="h3 mb-1">Welcome back</h1>
    <p class="text-secondary mb-4">Log in to see your events and registrations.</p>
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Email address</label>
        <input class="form-control" id="email" type="email" autocomplete="email" required>
        <div class="invalid-feedback"></div>
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <div class="input-group">
          <input class="form-control" id="password" type="password" autocomplete="current-password" required>
          <button class="btn btn-pw" type="button" data-toggle-pw="password" aria-label="Show password"><i class="bi bi-eye"></i></button>
          <div class="invalid-feedback"></div>
        </div>
      </div>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="form-check"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label small" for="remember">Keep me signed in on this device</label></div>
        <a href="#" id="forgotLink" class="small">Forgot password?</a>
      </div>
      <button id="loginBtn" class="btn btn-glow w-100" type="submit">Log in</button>
    </form>
    <p class="text-center text-secondary mt-4 mb-0">New here? <a href="register.html">Create an account</a></p>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/login.js"></script>
</body></html>
